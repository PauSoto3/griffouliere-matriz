<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Griffouliere — Matriz de Habilitación</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap');
:root{
  --bg:#111317;--surface:#1a1d24;--surface2:#22262f;--border:#2e3340;
  --red:#C41E24;--red-light:rgba(196,30,36,.12);
  --green:#1a7a3c;--green-bg:#0d2e1a;--green-light:#22c55e;--green-sub:rgba(26,122,60,.15);
  --amber:#d97706;--amber-light:#fbbf24;--amber-sub:rgba(217,119,6,.15);
  --teal:#0891b2;--teal-light:#22d3ee;--teal-sub:rgba(8,145,178,.12);
  --blue:#1d4ed8;--blue-bg:#0d1526;--blue-light:#60a5fa;--blue-sub:rgba(29,78,216,.12);
  --orange:#ea580c;--orange-bg:#1c0f06;--orange-light:#fb923c;--orange-sub:rgba(234,88,12,.12);
  --text:#e8eaf0;--text-muted:#8892a4;--text-dim:#4a5568;
  --charcoal:#2D2D2D;--font-d:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;--r:6px;
}
body.light{--bg:#f0f2f5;--surface:#fff;--surface2:#f5f7fa;--border:#dde1ea;--text:#1a1d24;--text-muted:#5a6478;--text-dim:#9aa3b2;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh;overflow-x:hidden;transition:background .2s,color .2s}

.nav{background:var(--charcoal);border-bottom:3px solid var(--red);padding:0 16px;
  display:flex;align-items:center;gap:10px;height:50px;position:sticky;top:0;z-index:200}
.nav-logo{font-family:var(--font-d);font-weight:800;font-size:17px;letter-spacing:2px;color:#fff;text-transform:uppercase}
.nav-logo span{color:var(--red)}
.nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:1px}
.nav-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.last-upd{font-size:11px;color:rgba(255,255,255,.45)}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);
  padding:5px 11px;border-radius:var(--r);cursor:pointer;font-size:11px;font-family:var(--font-b);transition:all .15s}
.btn:hover{background:rgba(255,255,255,.16);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;padding:0;font-size:15px}

/* ALERT */
.alert-wrap{display:none}.alert-wrap.show{display:block}
.alert-box{background:rgba(234,88,12,.08);border:1px solid var(--orange);border-left:4px solid var(--orange);
  padding:12px 16px;display:flex;align-items:flex-start;gap:12px;animation:slideIn .3s ease}
.alert-icon{font-size:20px;flex-shrink:0}
.alert-body{flex:1}
.alert-title{font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--orange-light);margin-bottom:4px}
.alert-detail{font-size:13px;color:var(--text-muted);line-height:1.7}
.miss-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(234,88,12,.18);
  border:1px solid rgba(234,88,12,.35);color:var(--orange-light);padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;margin:2px 3px}
.alert-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;padding:0 4px}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.hero{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 16px}
.hero-lbl{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:9px}
.hero-ccs{display:flex;gap:7px;flex-wrap:wrap}
.hero-cc{display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--surface2);border:2px solid var(--border);border-radius:8px;
  padding:9px 11px;cursor:pointer;transition:all .2s;min-width:95px}
.hero-cc:hover{border-color:var(--text-muted);transform:translateY(-1px)}
.hero-cc.active{border-color:var(--red);background:var(--red-light)}
.hero-cc-lbl{font-family:var(--font-d);font-weight:700;font-size:11px;color:var(--text);text-align:center;line-height:1.3}
.hero-cc-nums{display:flex;gap:4px}
.ccn{font-family:var(--font-d);font-weight:800;font-size:12px;padding:1px 5px;border-radius:3px}
.ccn.av{color:var(--green-light);background:var(--green-sub)}
.ccn.ok{color:var(--teal-light);background:var(--teal-sub)}
.ccn.f{color:var(--orange-light);background:var(--orange-sub)}

/* LAYOUT */
.main{display:flex;height:calc(100vh - 50px);overflow:hidden}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sb-head{padding:10px 12px 9px;border-bottom:1px solid var(--border)}
.sb-title{font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.search{position:relative}
.search input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:7px 10px 7px 30px;border-radius:var(--r);font-family:var(--font-b);font-size:13px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--red)}
.search-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px}
.sb-filters{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chip{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s}
.chip-all{border-color:var(--text-dim);color:var(--text-muted)}.chip-all.on{background:var(--surface2);border-color:#888;color:var(--text)}
.chip-av{border-color:var(--green);color:var(--green-light)}.chip-av.on{background:var(--green-bg)}
.chip-ok{border-color:var(--teal);color:var(--teal-light)}.chip-ok.on{background:rgba(8,145,178,.1)}
.chip-serv{border-color:var(--blue);color:var(--blue-light)}.chip-serv.on{background:var(--blue-sub)}
.chip-falta{border-color:var(--orange);color:var(--orange-light)}.chip-falta.on{background:var(--orange-bg)}
.sb-zone{padding:5px 10px;border-bottom:1px solid var(--border)}
.sb-zone select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:var(--r);font-family:var(--font-b);font-size:11px;outline:none}
.sb-zone select:focus{border-color:var(--red)}
.driver-list{overflow-y:auto;flex:1}
.d-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .12s}
.d-item:hover{background:var(--surface2)}
.d-item.sel{background:var(--red-light);border-left:3px solid var(--red)}
.d-ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:12px;flex-shrink:0}
.d-info{flex:1;min-width:0}
.d-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-sub{font-size:10px;color:var(--text-muted);margin-top:1px}
.d-pct{font-family:var(--font-d);font-weight:800;font-size:13px;flex-shrink:0}

/* CONTENT */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.stats{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.stat{flex:1;padding:8px 10px;text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border-right:none;flex:1.5;text-align:left;padding-left:12px;display:flex;align-items:center;justify-content:space-between}
.stat-v{font-family:var(--font-d);font-weight:800;font-size:20px}
.stat-l{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-top:1px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 14px;gap:2px;flex-shrink:0}
.tab{padding:10px 12px 8px;font-family:var(--font-d);font-weight:600;font-size:12px;
  letter-spacing:.5px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;text-transform:uppercase}
.tab:hover{color:var(--text)}.tab.on{color:var(--text);border-bottom-color:var(--red)}

/* QUICK VIEW */
.quick-view{flex:1;overflow-y:auto;padding:16px}
.qv-title{font-family:var(--font-d);font-weight:800;font-size:18px;margin-bottom:4px}
.qv-sub{font-size:12px;color:var(--text-muted);margin-bottom:13px}
.qv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
.qv-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s}
.qv-card:hover{border-color:var(--text-muted);transform:translateY(-1px)}
.qv-card.avalado{border-left:4px solid var(--green-light)}
.qv-card.avalado_falta{border-left:4px solid var(--amber-light)}
.qv-card.puede{border-left:4px solid var(--teal-light)}
.qv-card.serv{border-left:4px solid var(--blue-light)}
.qv-top{display:flex;justify-content:space-between;margin-bottom:8px}
.qv-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:13px}
.qv-pct{font-family:var(--font-d);font-weight:800;font-size:14px}
.qv-name{font-family:var(--font-d);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qv-sub2{font-size:10px;color:var(--text-muted);margin-top:2px}
.qv-badge{display:inline-flex;align-items:center;gap:3px;margin-top:8px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.qv-badge.avalado{background:var(--green-sub);color:var(--green-light)}
.qv-badge.avalado_falta{background:var(--amber-sub);color:var(--amber-light)}
.qv-badge.puede{background:var(--teal-sub);color:var(--teal-light)}
.qv-badge.serv{background:var(--blue-sub);color:var(--blue-light)}
.qv-missing{font-size:10px;color:var(--text-muted);margin-top:4px;line-height:1.4}

/* DETAIL */
.detail{flex:1;overflow-y:auto;padding:16px 18px}
.d-hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.d-big-ava{width:48px;height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:19px;flex-shrink:0}
.d-full-name{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.3px;line-height:1.2}
.d-meta{font-size:11px;color:var(--text-muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.poly-wrap{margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 13px}
.poly-hdr{display:flex;justify-content:space-between;margin-bottom:6px;align-items:center}
.poly-tit{font-family:var(--font-d);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)}
.poly-val{font-family:var(--font-d);font-weight:800;font-size:18px}
.poly-bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.poly-fill{height:100%;border-radius:4px;transition:width .6s ease}
.sec-lbl{font-family:var(--font-d);font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px;margin-top:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid transparent;display:flex;align-items:center;gap:4px}
.tag-y{background:var(--green-sub);border-color:rgba(26,122,60,.35);color:var(--green-light)}
.tag-n{background:rgba(30,34,44,.5);border-color:var(--border);color:var(--text-dim)}
body.light .tag-n{background:rgba(200,210,225,.3)}

/* CONTRACT CARDS - 5 estados */
.cc-grid{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.cc-card{background:var(--surface);border:1px solid var(--border);border-radius:7px;overflow:hidden}
/* EN SERVICIO */
.cc-card.s-serv      {border-left:4px solid var(--blue-light)}
/* AVALADO completo */
.cc-card.s-avalado   {border-left:4px solid var(--green-light)}
/* AVALADO pero faltan unidades/certs */
.cc-card.s-avfalta   {border-left:4px solid var(--amber-light)}
/* Cumple requisitos pero falta aval */
.cc-card.s-puede     {border-left:4px solid var(--teal-light)}
/* Falta todo */
.cc-card.s-falta     {border-left:4px solid var(--orange-light)}

.cc-hdr{padding:8px 12px;display:flex;align-items:center;gap:9px}
.cc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cc-name{font-family:var(--font-d);font-weight:600;font-size:13px;flex:1}
.cc-badges{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cc-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.b-serv    {background:var(--blue-sub);color:var(--blue-light)}
.b-avalado {background:var(--green-sub);color:var(--green-light)}
.b-avfalta {background:var(--amber-sub);color:var(--amber-light)}
.b-puede   {background:var(--teal-sub);color:var(--teal-light)}
.b-falta   {background:var(--orange-sub);color:var(--orange-light)}
.b-aval-ok {background:rgba(26,122,60,.12);color:var(--green-light);font-size:9px;border:1px solid rgba(26,122,60,.25)}

.cc-miss{padding:7px 12px 10px 30px;border-top:1px solid var(--border)}
.miss-tit{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.miss-tit.amber{color:var(--amber)}
.miss-tit.orange{color:var(--orange)}
.miss-items{display:flex;flex-wrap:wrap;gap:5px}
.miss-item{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.mi-aval{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.mi-comp{background:rgba(251,191,36,.09);color:var(--amber-light);border:1px solid rgba(251,191,36,.2)}
.mi-unit{background:var(--orange-sub);color:var(--orange-light);border:1px solid rgba(234,88,12,.2)}

/* MATRIX */
.mat-wrap{overflow:auto;flex:1}
.mat-tbl{border-collapse:collapse;min-width:100%;font-size:11px}
.mat-tbl th{background:var(--surface);padding:7px 5px;text-align:center;font-family:var(--font-d);font-weight:700;font-size:10px;
  letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0;z-index:5;cursor:pointer}
.mat-tbl th:hover{color:var(--text)}
.mat-tbl th.th-d{min-width:175px;text-align:left;padding-left:12px;position:sticky;left:0;z-index:10;background:var(--surface)}
.mat-tbl td{border:1px solid var(--border);padding:5px 3px;text-align:center;vertical-align:middle}
.mat-tbl td.td-d{text-align:left;padding-left:10px;background:var(--surface);position:sticky;
  left:0;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:175px;cursor:pointer;font-size:12px}
.mat-tbl tr:hover td{background:rgba(128,128,128,.05)}
.mat-tbl tr:hover td.td-d{background:var(--surface2)}
/* Matrix cell colors - 5 estados */
.c-serv   {background:var(--blue-sub);color:var(--blue-light);font-weight:700;font-size:11px}
.c-avalado{background:var(--green-sub);color:var(--green-light);font-weight:700;font-size:11px}
.c-avfalta{background:var(--amber-sub);color:var(--amber-light);font-weight:700;font-size:11px;cursor:pointer}
.c-avfalta:hover{background:rgba(217,119,6,.28)}
.c-puede  {background:var(--teal-sub);color:var(--teal-light);font-weight:700;font-size:11px}
.c-falta  {background:var(--orange-sub);color:var(--orange-light);font-weight:700;cursor:pointer;font-size:13px}
.c-falta:hover{background:rgba(234,88,12,.28)}

/* PDF MODAL */
.pdf-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;align-items:center;justify-content:center}
.pdf-overlay.show{display:flex}
.pdf-modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px;width:360px;max-width:90vw}
.pdf-title{font-family:var(--font-d);font-weight:700;font-size:16px;margin-bottom:14px}
.pdf-option{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);
  border-radius:7px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.pdf-option:hover{border-color:var(--red);background:var(--red-light)}
.pdf-option-icon{font-size:22px;flex-shrink:0}
.pdf-option-text strong{font-size:13px;display:block;margin-bottom:2px}
.pdf-option-text span{font-size:11px;color:var(--text-muted)}
.pdf-close{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
  padding:8px 16px;border-radius:var(--r);cursor:pointer;font-family:var(--font-b);font-size:12px;width:100%;margin-top:4px}
.pdf-close:hover{border-color:var(--text-muted);color:var(--text)}

.loading{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:var(--text-muted)}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--text-dim);gap:8px}
.err-box{background:rgba(196,30,36,.07);border:1px solid var(--red);border-radius:8px;padding:14px 16px;margin:16px;font-size:13px;color:#f87171;line-height:1.6}

/* LEYENDA */
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:10px}
.leg-item{display:flex;align-items:center;gap:5px;color:var(--text-muted)}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

@media(max-width:680px){
  .sidebar{width:100%;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}
  .main{flex-direction:column}
  .qv-grid{grid-template-columns:1fr 1fr}
  .hero-cc{min-width:80px;padding:7px 9px}
  .last-upd{display:none}
}
@media print{.nav,.hero,.sidebar,.tabs,.alert-wrap,.pdf-overlay,.legend{display:none!important}.main{height:auto;flex-direction:column}.content{overflow:visible}.mat-wrap{overflow:visible}.mat-tbl th,.mat-tbl td.td-d{position:static}}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:#3a3f4e;border-radius:3px}

/* ── RANKING ── */
.ranking-view{flex:1;overflow-y:auto;padding:16px}
.rank-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.rank-title{font-family:var(--font-d);font-weight:800;font-size:18px}
.rank-cc-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:var(--r);font-family:var(--font-b);font-size:12px;outline:none;min-width:200px}
.rank-cc-sel:focus{border-color:var(--red)}
.rank-zone-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:6px 10px;border-radius:var(--r);font-family:var(--font-b);font-size:12px;outline:none}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{background:var(--surface);padding:9px 12px;text-align:left;
  font-family:var(--font-d);font-weight:700;font-size:11px;letter-spacing:1px;
  text-transform:uppercase;color:var(--text-muted);border-bottom:2px solid var(--border);
  position:sticky;top:0;z-index:5}
.rank-table th.th-center{text-align:center}
.rank-table tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.rank-table tr:hover td{background:var(--surface2)}
.rank-pos{font-family:var(--font-d);font-weight:800;font-size:16px;text-align:center;
  width:48px;padding:10px 8px}
.rank-medal{font-size:20px;text-align:center;padding:10px 8px;width:48px}
.rank-ava{padding:8px 0 8px 12px;width:44px}
.rank-ava-circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;

<body>

<div id="app">

<script>
// ════════════════════════════════════════════════════
//  CONFIGURACIÓN
// ════════════════════════════════════════════════════
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzkeddUK8VdnoE9xW_NOJZ8gZcA8NEel0ehVn3dIL5599I3ZPcRSjye-Ov-KYQ95mkT/exec';
const COMP_LABELS = ['Lic. CAT E1','Cargas Peligrosas','Manejo Defensivo','Carnet Hidrogrúa'];
const UNIT_LABELS = ['Chupa 9mts','Superchupa','Vactor','Piletero','Hidrogrúa','Capilar','Agua','Regador','Cisterna Líq.','Playo','Portacontenedor'];
const AUTO_REFRESH_MS = 5 * 60 * 1000;

let DATA=null,LOADING=true,ERR=null;
let ST={selected:null,tab:'quick',search:'',filter:'all',ccFilter:null,zoneFilter:null,alert:null,lastUpd:null,darkMode:true,rankCC:'',rankZone:''};
if(localStorage.getItem('griff_mode')==='light'){ST.darkMode=false;document.body.classList.add('light');}

// ════════════════════════════════════════════════════
//  JSONP
// ════════════════════════════════════════════════════
function loadDataJsonp(){
  return new Promise((res,rej)=>{
    const cb='_griff_'+Date.now();
    window[cb]=d=>{cleanup();d?.error?rej(new Error(d.message)):res(d);};
    const s=document.createElement('script');
    s.src=`${BACKEND_URL}?action=getData&callback=${cb}`;
    const cleanup=()=>{delete window[cb];s.parentNode?.removeChild(s);};
    s.onerror=()=>{cleanup();rej(new Error('No se pudo conectar.'));};
    const t=setTimeout(()=>{cleanup();rej(new Error('Tiempo agotado (20s).'));},20000);
    s.onload=()=>clearTimeout(t);
    document.head.appendChild(s);
  });
}

async function loadData(){
  LOADING=true;ERR=null;render();
  try{
    if(!BACKEND_URL||BACKEND_URL==='TU_URL_AQUI') throw new Error('Configurar BACKEND_URL con la URL de Apps Script.');
    const r=await loadDataJsonp();
    if(!r.conductores?.length) throw new Error('Sin conductores. Verificá SS_ID en Code.gs.');
    DATA={conductores:r.conductores,contratos:r.contratos?.length?r.contratos:FALLBACK,avales:r.avales||{}};
    ST.lastUpd=new Date().toLocaleTimeString('es-AR');
    if(!ST.selected&&DATA.conductores.length) ST.selected=DATA.conductores[0].cuil;
  }catch(e){ERR=e.message;}
  LOADING=false;render();
}

// ════════════════════════════════════════════════════
//  LÓGICA DE HABILITACIÓN — 5 estados
//  serv     → EN SERVICIO (asignado a este contrato)
//  avalado  → tiene aval + cumple todos los requisitos
//  avfalta  → tiene aval PERO le faltan unidades o certs
//  puede    → cumple todos los requisitos PERO no tiene aval
//  falta    → no tiene aval + le faltan requisitos
// ════════════════════════════════════════════════════
// Obtener info del aval (puede ser objeto {cc,vence,dias} o string legacy)
function getAvalInfo(k, ccId) {
  const lista = DATA.avales[k];
  if (!lista) return null;
  // Nuevo formato: array de objetos
  if (lista[0] && typeof lista[0] === 'object') {
    return lista.find(a => a.cc === ccId) || null;
  }
  // Legacy: array de strings
  return lista.includes(ccId) ? { cc: ccId, vence: null, dias: null } : null;
}

function getStatus(d, ct) {
  const k = String(d.cuil);
  const avalInfo = getAvalInfo(k, ct.id);
  const hasAval  = !!avalInfo;

  // Verificar si el aval está vencido
  const avalVencido = hasAval && avalInfo.dias !== null && avalInfo.dias < 0;
  const avalProximo = hasAval && avalInfo.dias !== null && avalInfo.dias >= 0 && avalInfo.dias <= 30;

  // Verificar certs y unidades
  const missingReqs = [];
  ct.comp_req.forEach((r,i) => { if(r && d.comps[i]<1) missingReqs.push({tipo:'comp', label:COMP_LABELS[i]}); });
  ct.unit_req.forEach((r,i) => { if(r && d.units[i]<1) missingReqs.push({tipo:'unit', label:UNIT_LABELS[i]}); });

  // EN SERVICIO
  if (d.contrato === ct.id) {
    return { status:'serv', hasAval, avalInfo, avalVencido, avalProximo, missing:[] };
  }

  // Si el aval está vencido — tratarlo como sin aval válido
  if (avalVencido) {
    const allMissing = [{tipo:'aval', label:'Aval VENCIDO el '+avalInfo.vence}, ...missingReqs];
    return { status:'falta', hasAval:false, avalInfo, avalVencido:true, avalProximo:false, missing:allMissing, vencido:true };
  }

  // AVALADO completo
  if (hasAval && missingReqs.length === 0) {
    return { status:'avalado', hasAval:true, avalInfo, avalVencido:false, avalProximo, missing:[] };
  }

  // AVALADO PARCIAL — tiene aval pero faltan unidades/certs
  if (hasAval && missingReqs.length > 0) {
    return { status:'avfalta', hasAval:true, avalInfo, avalVencido:false, avalProximo, missing:missingReqs };
  }

  // PUEDE — cumple requisitos pero no tiene aval
  if (!hasAval && missingReqs.length === 0) {
    return { status:'puede', hasAval:false, avalInfo:null, avalVencido:false, avalProximo:false, missing:[{tipo:'aval', label:'Aval / Habilitación'}] };
  }

  // FALTA TODO
  return { status:'falta', hasAval:false, avalInfo:null, avalVencido:false, avalProximo:false,
    missing:[{tipo:'aval', label:'Aval / Habilitación'}, ...missingReqs] };
}

function statsFor(id){
  if(!DATA||!id) return {serv:0,avalado:0,avfalta:0,puede:0,falta:0};
  const ct=DATA.contratos.find(c=>c.id===id);if(!ct) return {serv:0,avalado:0,avfalta:0,puede:0,falta:0};
  const r={serv:0,avalado:0,avfalta:0,puede:0,falta:0};
  DATA.conductores.forEach(d=>r[getStatus(d,ct).status]++);
  return r;
}

// Color y texto por estado
function statusColor(s){
  return s==='serv'?'var(--blue-light)':s==='avalado'?'var(--green-light)':
    s==='avfalta'?'var(--amber-light)':s==='puede'?'var(--teal-light)':'var(--orange-light)';
}
function statusBadgeClass(s){
  return 'b-'+s;
}
function statusLabel(s, hasAval, avalInfo, avalVencido, avalProximo){
  if(s==='serv'){
    if(avalVencido) return '✔ EN SERVICIO · ⚠ AVAL VENCIDO';
    if(hasAval && avalProximo) return '✔ EN SERVICIO · AVALADO ⚠ Vence pronto';
    return hasAval ? '✔ EN SERVICIO · AVALADO' : '✔ EN SERVICIO';
  }
  if(s==='avalado'){
    if(avalProximo && avalInfo?.dias !== null) return `✔ AVALADO · ⚠ Vence en ${avalInfo.dias}d`;
    return '✔ AVALADO';
  }
  if(s==='avfalta'){
    if(avalProximo && avalInfo?.dias !== null) return `🔑 AVALADO · Falta requisitos · ⚠ Vence ${avalInfo.dias}d`;
    return '🔑 AVALADO · Falta requisitos';
  }
  if(s==='puede')  return '~ Cumple · Falta Aval';
  if(s==='falta' && avalVencido) return '⚠ AVAL VENCIDO';
  return '⚠ FALTA';
}
function statusCardClass(s){
  return s==='serv'?'s-serv':s==='avalado'?'s-avalado':s==='avfalta'?'s-avfalta':s==='puede'?'s-puede':'s-falta';
}
function missTit(s){
  if(s==='avfalta') return '<div class="miss-tit amber">Tiene aval — le faltan para trabajar aquí:</div>';
  if(s==='puede')   return '<div class="miss-tit" style="color:var(--teal)">Cumple requisitos — le falta:</div>';
  return '<div class="miss-tit orange">Para trabajar aquí necesita:</div>';
}

const pc=p=>p>=70?'var(--green-light)':p>=40?'var(--amber-light)':'#f87171';
const pb=p=>p>=70?'var(--green)':p>=40?'var(--amber)':'var(--red)';
const pl=p=>p>=70?'ALTA':p>=40?'MEDIA':'BAJA';
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const avS=p=>p>=70?{bg:'rgba(26,122,60,.25)',fg:'#22c55e'}:p>=40?{bg:'rgba(217,119,6,.2)',fg:'#fbbf24'}:{bg:'rgba(196,30,36,.2)',fg:'#f87171'};
const zones=()=>DATA?[...new Set(DATA.conductores.map(d=>d.zona).filter(Boolean))].sort():[];

function filtered(){
  if(!DATA) return [];
  let list=DATA.conductores;
  if(ST.search){const q=ST.search.toLowerCase();list=list.filter(d=>d.nombre.toLowerCase().includes(q)||String(d.cuil).includes(q)||d.zona.toLowerCase().includes(q));}
  if(ST.zoneFilter) list=list.filter(d=>d.zona===ST.zoneFilter);
  const ct=ST.ccFilter?DATA.contratos.find(c=>c.id===ST.ccFilter):null;
  if(ct&&ST.filter!=='all'){
    list=list.filter(d=>{
      const s=getStatus(d,ct).status;
      if(ST.filter==='av') return s==='avalado';
      if(ST.filter==='avfalta') return s==='avfalta';
      if(ST.filter==='ok') return s==='puede';
      if(ST.filter==='serv') return s==='serv';
      if(ST.filter==='falta') return s==='falta';
      return true;
    });
  }
  return list;
}

function toggleMode(){

  hidePdfModal();if(!DATA){alert('Esperá que carguen los datos.');return;}

      .sort((a,b)=>{
        const ORDER={serv:0,avalado:1,avfalta:2,puede:3};
        const sa=getStatus(a,ct).status,sb=getStatus(b,ct).status;
        return (ORDER[sa]??9)-(ORDER[sb]??9)||b.pct-a.pct;
      })
      .map(d=>{const {status,hasAval}=getStatus(d,ct);

        const col=status==='serv'?'#1d4ed8':status==='avalado'?'#16a34a':status==='avfalta'?'#d97706':'#0891b2';
        return `<tr><td>${d.nombre}</td><td>${d.puesto}</td><td>${d.zona}</td>

        <td>${d.contrato}</td><td style="font-weight:700;color:${pc(d.pct)}">${d.pct}% ${pl(d.pct)}</td></tr>`);
  }
  const win=window.open('','_blank');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>

  .footer{margin-top:20px;font-size:10px;color:#999}

function render(){document.getElementById('app').innerHTML=buildApp();bindEvents();}

function buildApp(){
  const drivers=filtered(),sel=ST.selected&&DATA?DATA.conductores.find(d=>d.cuil===ST.selected):null;

            <span class="ccn av" title="Avalados: ${s.serv+s.avalado}">${s.serv+s.avalado}</span>

          drivers.length===0?'<div class="empty"><span style="font-size:26px">🔍</span><span style="font-size:12px">Sin resultados</span></div>':
          drivers.map(d=>{
            const av=avS(d.pct);
            const ct2=ST.ccFilter?DATA.contratos.find(c=>c.id===ST.ccFilter):null;
            const st2=ct2?getStatus(d,ct2).status:null;
            let bg='';
            if(st2==='serv')    bg='background:rgba(29,78,216,.07)';
            if(st2==='avalado') bg='background:rgba(26,122,60,.07)';
            if(st2==='avfalta') bg='background:rgba(217,119,6,.07)';
            if(st2==='puede')   bg='background:rgba(8,145,178,.07)';
            if(st2==='falta')   bg='background:rgba(234,88,12,.04)';
            return `<div class="d-item ${sel&&sel.cuil===d.cuil?'sel':''}" data-cuil="${d.cuil}" style="${bg}">

        <div class="stat">
          <div class="stat-v" style="color:var(--teal-light)">${stats.puede}</div>
          <div class="stat-l">Cumple·Falta Aval</div>
        </div>
        <div class="stat">
          <div class="stat-v" style="color:var(--orange-light)">${stats.falta}</div>
          <div class="stat-l">Le falta todo</div>
        </div>
        <div class="stat">

            <div style="font-size:10px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase">Contrato</div>
            <div style="font-size:12px;font-weight:600;margin-top:2px">${DATA.contratos.find(c=>c.id===ST.ccFilter)?.label}</div>

      ${ST.tab==='quick'?buildQuick():ST.tab==='detail'?buildDetail(sel):ST.tab==='ranking'?buildRanking():buildMatrix(drivers)}

  </div>`;
}

function buildQuick(){
  if(!DATA) return '';
  if(!ST.ccFilter) return `<div class="quick-view"><div class="empty" style="height:320px">
    <span style="font-size:44px">☝️</span>
    <span style="font-family:var(--font-d);font-size:16px;color:var(--text-muted);letter-spacing:.5px">Seleccioná un contrato arriba</span>
    <span style="font-size:11px;color:var(--text-dim);text-align:center;max-width:240px;line-height:1.7">
      🟢 Avalados · 🔵 En Servicio · 🟡 Aval+Falta algo · 🔵 Cumple·Sin Aval
    </span>
  </div></div>`;
  const ct=DATA.contratos.find(c=>c.id===ST.ccFilter);if(!ct) return '';
  // Mostrar: serv, avalado, avfalta, puede (ordenados)
  const ORDER={serv:0,avalado:1,avfalta:2,puede:3};
  let disp=DATA.conductores
    .filter(d=>['serv','avalado','avfalta','puede'].includes(getStatus(d,ct).status))
    .map(d=>({...d,_st:getStatus(d,ct)}));
  if(ST.zoneFilter) disp=disp.filter(d=>d.zona===ST.zoneFilter);
  disp.sort((a,b)=>(ORDER[a._st.status]??9)-(ORDER[b._st.status]??9)||b.pct-a.pct);

  return `<div class="quick-view">
    <div class="qv-title">${disp.length} disponible${disp.length!==1?'s':''} — ${ct.label}</div>
    <div class="qv-sub">🟢 Avalado ✔ · 🔵 En Servicio · 🟡 Avalado con falta · 🩵 Cumple sin aval</div>
    ${disp.length===0?`<div class="empty" style="height:200px">
      <span style="font-size:32px">😔</span>
      <span style="font-size:13px;color:var(--text-muted)">Sin disponibles${ST.zoneFilter?' en '+ST.zoneFilter:''}</span>
    </div>`:`<div class="qv-grid">
      ${disp.map(d=>{const {status,hasAval,missing}=d._st,av=avS(d.pct);
        return `<div class="qv-card ${status}" data-cuil="${d.cuil}">
          <div class="qv-top">
            <div class="qv-ava" style="background:${av.bg};color:${av.fg}">${ini(d.nombre)}</div>
            <div class="qv-pct" style="color:${pc(d.pct)}">${d.pct}%</div>
          </div>
          <div class="qv-name">${d.nombre}</div>
          <div class="qv-sub2">${d.puesto.replace('Conductor de ','C.')} · ${d.zona}</div>
          <div class="qv-badge ${status}">${statusLabel(status,hasAval,avalInfo,avalVencido,avalProximo)}</div>
          ${avalVencido?'<div class="qv-missing" style="color:#f87171">⛔ Aval vencido el '+avalInfo.vence+'</div>':''}
          ${!avalVencido&&avalProximo&&avalInfo?.vence?`<div class="qv-missing" style="color:var(--amber-light)">⚠ Aval vence en ${avalInfo.dias} días (${avalInfo.vence})</div>`:''}
          ${status==='avfalta'?`<div class="qv-missing">Falta: ${missing.map(m=>m.label).join(', ')}</div>`:''}
        </div>`;}).join('')}
    </div>`}
  </div>`;
}

function buildMatrix(drivers){
  if(!DATA) return '';
  const MAX=80,shown=drivers.slice(0,MAX);
  const cellClass={serv:'c-serv',avalado:'c-avalado',avfalta:'c-avfalta',puede:'c-puede',falta:'c-falta'};
  const cellTxt={serv:'✔S',avalado:'✔AV',avfalta:'🔑⚠',puede:'~AV',falta:'⚠'};
  return `<div class="mat-wrap">
    <table class="mat-tbl">
      <thead><tr>
        <th class="th-d">Conductor</th>
        ${DATA.contratos.map(ct=>`<th data-cc="${ct.id}">${ct.label.split('·').pop().trim()}</th>`).join('')}
        <th>Pol.</th>
      </tr></thead>
      <tbody>${shown.map(d=>`<tr>
        <td class="td-d" data-cuil="${d.cuil}" title="${d.nombre}">${d.nombre.length>23?d.nombre.slice(0,22)+'…':d.nombre}</td>
        ${DATA.contratos.map(ct=>{
          const {status,missing}=getStatus(d,ct);
          const cls=cellClass[status]||'c-falta';
          const txt=cellTxt[status]||'⚠';
          const canAlert=status==='falta'||status==='avfalta'||status==='puede';
          const tip=missing.map(m=>(m.tipo==='aval'?'🔑':m.tipo==='comp'?'📋':'🚛')+' '+m.label).join('\n');
          return `<td class="${cls}" ${canAlert?`data-alert="${d.cuil}|${ct.id}"`:''} title="${tip||statusLabel(status,false)}">${txt}</td>`;
        }).join('')}
        <td style="color:${pc(d.pct)};font-weight:700">${d.pct}%</td>
      </tr>`).join('')}</tbody>
    </table>
    ${drivers.length>MAX?`<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:11px">Mostrando ${MAX} de ${drivers.length} — usá el buscador para ver más</div>`:''}
    <div style="padding:10px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;font-size:10px">
      <span style="color:var(--green-light)">✔AV = Avalado</span>
      <span style="color:var(--blue-light)">✔S = En Servicio</span>
      <span style="color:var(--amber-light)">🔑⚠ = Aval+Falta algo</span>
      <span style="color:var(--teal-light)">~AV = Cumple·Sin Aval</span>
      <span style="color:var(--orange-light)">⚠ = Falta todo</span>
    </div>
  </div>`;
}


function buildRanking(){
  if(!DATA) return '';

  const zl=zones();
  const ccSel=ST.rankCC||'';
  const zoneSel=ST.rankZone||'';

  // Filter drivers
  let list=DATA.conductores;
  if(zoneSel) list=list.filter(d=>d.zona===zoneSel);

  // If CC selected, show only drivers relevant to that CC (en servicio or avalados)
  let titulo='', sub='';
  if(ccSel){
    const ct=DATA.contratos.find(c=>c.id===ccSel);
    if(ct){
      // Rank all, highlight who is available for this CC
      titulo=`Ranking de Polivalencia — ${ct.label}`;
      sub='Ordenado por % de polivalencia · Click en un conductor para ver su detalle';
    }
  } else {
    titulo='Ranking General de Polivalencia';
    sub='Seleccioná un contrato para filtrar por CC · Click para ver detalle';
  }

  // Sort by pct descending
  const ranked=[...list].sort((a,b)=>b.pct-a.pct);
  const top3=ranked.slice(0,3);
  const rest=ranked.slice(3);

  const ct=ccSel?DATA.contratos.find(c=>c.id===ccSel):null;

  function statusBadge(d){
    if(!ct) return '';
    const {status}=getStatus(d,ct);
    if(status==='serv')    return '<span style="font-size:9px;padding:1px 5px;border-radius:10px;background:var(--blue-sub);color:var(--blue-light)">EN SERV.</span>';
    if(status==='avalado') return '<span style="font-size:9px;padding:1px 5px;border-radius:10px;background:var(--green-sub);color:var(--green-light)">AVALADO</span>';
    if(status==='avfalta') return '<span style="font-size:9px;padding:1px 5px;border-radius:10px;background:var(--amber-sub);color:var(--amber-light)">AV+FALTA</span>';
    if(status==='puede')   return '<span style="font-size:9px;padding:1px 5px;border-radius:10px;background:var(--teal-sub);color:var(--teal-light)">SIN AVAL</span>';
    return '<span style="font-size:9px;padding:1px 5px;border-radius:10px;background:var(--orange-sub);color:var(--orange-light)">FALTA</span>';
  }

  function medal(pos){ return pos===0?'🥇':pos===1?'🥈':pos===2?'🥉':''; }
  function podiumClass(pos){ return pos===0?'podium-1':pos===1?'podium-2':'podium-3'; }

  return \`<div class="ranking-view">
    <div class="rank-header">
      <div class="rank-title">🏆 \${titulo}</div>
      <select class="rank-cc-sel" id="rankCCSel">
        <option value="">— Todos los contratos —</option>
        \${DATA.contratos.map(c=>\`<option value="\${c.id}" \${ccSel===c.id?'selected':''}>\${c.label}</option>\`).join('')}
      </select>
      <select class="rank-zone-sel" id="rankZoneSel">
        <option value="">📍 Todas las zonas</option>
        \${zl.map(z=>\`<option value="\${z}" \${zoneSel===z?'selected':''}>\${z}</option>\`).join('')}
      </select>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:14px">\${sub} · \${ranked.length} conductores</div>

    \${top3.length>=3?\`
    <div class="rank-podium">
      \${[top3[1],top3[0],top3[2]].map((d,i)=>{
        const realPos=i===0?1:i===1?0:2;
        const av=avS(d.pct);
        return \`<div class="podium-item" data-cuil="\${d.cuil}">
          <div class="podium-name">\${d.nombre.split(' ').slice(0,2).join(' ')}</div>
          <div class="podium-pct" style="color:\${pc(d.pct)}">\${d.pct}%</div>
          \${statusBadge(d)}
          <div class="podium-block \${podiumClass(realPos)}">
            <div class="podium-medal">\${medal(realPos)}</div>
          </div>
          <div class="podium-sub">\${d.zona}</div>
        </div>\`;
      }).join('')}
    </div>\`:''}

    <table class="rank-table">
      <thead><tr>
        <th class="th-center" style="width:48px">#</th>
        <th style="width:44px"></th>
        <th>Conductor</th>
        \${ct?'<th class="th-center">Estado</th>':''}
        <th class="th-center">Unidades</th>
        <th>Polivalencia</th>
      </tr></thead>
      <tbody>
        \${ranked.map((d,i)=>{
          const av=avS(d.pct);
          const med=medal(i);
          return \`<tr data-cuil="\${d.cuil}">
            <td class="rank-medal">\${med||\`<span style="color:var(--text-dim);font-family:var(--font-d);font-size:13px">\${i+1}</span>\`}</td>
            <td class="rank-ava">
              <div class="rank-ava-circle" style="background:\${av.bg};color:\${av.fg}">\${ini(d.nombre)}</div>
            </td>
            <td class="rank-name-cell">
              <div class="rank-name">\${d.nombre}</div>
              <div class="rank-sub">\${d.puesto.replace('Conductor de ','C.')} · \${d.zona}</div>
            </td>
            \${ct?\`<td class="rank-status-cell">\${statusBadge(d)}</td>\`:''}
            <td class="rank-units">\${d.score}/11</td>
            <td class="rank-bar-cell">
              <div class="rank-bar-wrap">
                <div class="rank-bar-bg">
                  <div class="rank-bar-fill" style="width:\${d.pct}%;background:\${pb(d.pct)}"></div>
                </div>
                <div class="rank-pct" style="color:\${pc(d.pct)}">\${d.pct}%</div>
              </div>
            </td>
          </tr>\`;
        }).join('')}
      </tbody>
    </table>
  </div>\`;
}

function bindEvents(){
  document.getElementById('btnRef')?.addEventListener('click',loadData);
  document.getElementById('btnMode')?.addEventListener('click',toggleMode);
  document.getElementById('btnPdf')?.addEventListener('click',showPdfModal);
  document.getElementById('btnAlertClose')?.addEventListener('click',()=>{ST.alert=null;render();});
  document.getElementById('btnClearF')?.addEventListener('click',()=>{ST.ccFilter=null;ST.filter='all';render();});
  document.getElementById('pdfCloseBtn')?.addEventListener('click',hidePdfModal);
  document.getElementById('pdfDisp')?.addEventListener('click',()=>exportPdf('disp'));
  document.getElementById('pdfAll')?.addEventListener('click',()=>exportPdf('all'));
  document.getElementById('pdfFalta')?.addEventListener('click',()=>exportPdf('falta'));
  document.getElementById('pdfOverlay')?.addEventListener('click',e=>{if(e.target.id==='pdfOverlay') hidePdfModal();});
  const srch=document.getElementById('srch');
  if(srch) srch.addEventListener('input',e=>{
    ST.search=e.target.value;render();
    const el=document.getElementById('srch');el?.focus();el?.setSelectionRange(ST.search.length,ST.search.length);
  });
  document.getElementById('zoneSel')?.addEventListener('change',e=>{ST.zoneFilter=e.target.value||null;render();});
  document.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('click',()=>{ST.filter=el.dataset.f;render();}));
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ST.tab=el.dataset.tab;render();}));
  document.querySelectorAll('[data-hcc]').forEach(el=>el.addEventListener('click',()=>{
    ST.ccFilter=ST.ccFilter===el.dataset.hcc?null:el.dataset.hcc;
    if(ST.ccFilter&&ST.tab==='detail') ST.tab='quick';render();
  }));
  document.querySelectorAll('.d-item[data-cuil]').forEach(el=>el.addEventListener('click',()=>{ST.selected=parseInt(el.dataset.cuil);ST.tab='detail';render();}));
  document.querySelectorAll('.qv-card[data-cuil]').forEach(el=>el.addEventListener('click',()=>{ST.selected=parseInt(el.dataset.cuil);ST.tab='detail';render();}));
  document.querySelectorAll('.td-d[data-cuil]').forEach(el=>el.addEventListener('click',()=>{ST.selected=parseInt(el.dataset.cuil);ST.tab='detail';render();}));
  document.querySelectorAll('th[data-cc]').forEach(el=>el.addEventListener('click',()=>{ST.ccFilter=ST.ccFilter===el.dataset.cc?null:el.dataset.cc;render();}));
  // Ranking selectors
  document.getElementById('rankCCSel')?.addEventListener('change',e=>{ST.rankCC=e.target.value||'';render();});
  document.getElementById('rankZoneSel')?.addEventListener('change',e=>{ST.rankZone=e.target.value||'';render();});
  // Ranking row click → detail
  document.querySelectorAll('.rank-table tr[data-cuil]').forEach(el=>el.addEventListener('click',()=>{ST.selected=parseInt(el.dataset.cuil);ST.tab='detail';render();}));
  document.querySelectorAll('.podium-item[data-cuil]').forEach(el=>el.addEventListener('click',()=>{ST.selected=parseInt(el.dataset.cuil);ST.tab='detail';render();}));

  document.querySelectorAll('[data-alert]').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();if(!DATA)return;
    const[cuil,ccId]=el.dataset.alert.split('|');
    const d=DATA.conductores.find(x=>String(x.cuil)===cuil),ct=DATA.contratos.find(c=>c.id===ccId);
    if(!d||!ct)return;
    const{status,missing}=getStatus(d,ct);
    ST.alert={nombre:d.nombre,contrato:ct.label,missing};render();
  }));
}
